[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag*", "cli*"]

[project]
name = "modular-rag"
version = "0.1.0"
description = "Modular RAG codebase assistant"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tiktoken>=0.7.0",
    "python-dotenv>=1.0.0",
    "pathspec>=0.12.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
rag-ingest = "cli.ingest:main"
rag-chat   = "cli.chat:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]
